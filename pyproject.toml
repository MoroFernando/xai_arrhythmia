[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-arrhythmia"
version = "0.1.0"
description = "Framework para interpretacao quantitativa do Grad-CAM em modelos de classificacao de arritmias cardiacas"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "wfdb>=4.1.2",
    "torch>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]
