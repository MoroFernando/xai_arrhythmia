<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img"><title>Pipeline e fontes da execução final</title><style>text{font-family:Arial,sans-serif;fill:#183342;font-size:16px}.title{font-size:25px;font-weight:bold}.small{font-size:13px}.grid{stroke:#dce5e9;stroke-width:1}</style><rect width="1200" height="310" fill="#fff"/><text class="title" x="35" y="40">Pipeline e fontes da execução final</text><rect x="45" y="105" width="310" height="110" rx="10" fill="#e5f2f5"/><text x="65" y="145" class="">MIT-BIH: treino / validação</text><text x="65" y="180" class="">CNN 1D → BEST por BA MIT</text><path d="M355 160 H420" stroke="#126E82" stroke-width="3"/><text x="375" y="150" class="">→</text><rect x="425" y="105" width="320" height="110" rx="10" fill="#fff0e6"/><text x="445" y="145" class="">LUDB: teste externo</text><text x="445" y="180" class="">Predições congeladas, 0,5</text><path d="M745 160 H810" stroke="#126E82" stroke-width="3"/><text x="765" y="150" class="">→</text><rect x="815" y="105" width="340" height="110" rx="10" fill="#eee9f8"/><text x="835" y="145" class="">Grad-CAM → máscaras P/QRS/T</text><text x="835" y="180" class="">IoU já calculado e preservado</text><text x="45" y="270" class="small">Esta revisão lê esses artefatos; não executa nenhuma dessas etapas.</text></svg>